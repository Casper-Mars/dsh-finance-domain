# dsh-finance-domain bundle patch —— 领域包自带「core + domain」两层
#
# 只需 `dsh plugin --profile <p> add <本包>`：pnpm 装好本包后，bundle patch 一次
# 插入两层，profile 里同时得到 rsi-agent（agentHost 提供方）与本领域。
#
# id/name/inject 必须与两边 src/plugin.ts 逐项一致。

- insert:
    - id: rsi-agent
      name: dsh-rsi-agent
      inject: ['tools', 'skills', 'fs']
    - id: finance-domain
      name: dsh-finance-domain
      inject: ['agentHost']
